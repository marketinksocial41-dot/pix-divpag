<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>PIX DIVPAG</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>

    body{
      margin:0;
      background:#f5f5f5;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .card{
      width:400px;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      color:#1d2b53;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:12px;
      border:1px solid #ccc;
      border-radius:8px;
      box-sizing:border-box;
      font-size:16px;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:15px;
      border:none;
      border-radius:8px;
      background:#0d6efd;
      color:white;
      font-size:16px;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover{
      background:#0b5ed7;
    }

    #qrcode{
      text-align:center;
      margin-top:20px;
    }

    #pix{
      margin-top:20px;
      background:#f1f1f1;
      padding:10px;
      border-radius:8px;
      word-break:break-all;
      font-size:13px;
    }

    .copy{
      background:#198754;
    }

  </style>

</head>
<body>

<div class="card">

  <h2>Gerar PIX DIVPAG</h2>

  <input
    type="number"
    id="valor"
    placeholder="Valor"
  >

  <input
    type="text"
    id="descricao"
    placeholder="Descrição"
  >

  <button onclick="gerarPix()">
    Gerar PIX
  </button>

  <div id="qrcode"></div>

  <div id="pix"></div>

  <button
    class="copy"
    onclick="copiarPix()"
  >
    Copiar PIX
  </button>

</div>

<script>

async function gerarPix(){

  const valor =
    document.getElementById("valor").value;

  const descricao =
    document.getElementById("descricao").value;

  if(!valor){

    alert("Digite um valor");
    return;

  }

  try{

    const url =
      `/?valor=${valor}&descricao=${encodeURIComponent(descricao)}`;

    const response =
      await fetch(url);

    const data =
      await response.json();

    console.log(data);

    // AJUSTE CONFORME RETORNO DA SUA API
    const codigoPix =
      data.pix ||
      data.qrcode ||
      data.payload ||
      data.copiaecola;

    if(!codigoPix){

      alert("PIX não retornado");
      return;

    }

    document
      .getElementById("pix")
      .innerText = codigoPix;

    document
      .getElementById("qrcode")
      .innerHTML = "";

    QRCode.toCanvas(

      codigoPix,

      {
        width:280
      },

      function(error, canvas){

        if(error){

          console.error(error);
          return;

        }

        document
          .getElementById("qrcode")
          .appendChild(canvas);

      }

    );

  }catch(err){

    console.log(err);

    alert("Erro ao gerar PIX");

  }

}


function copiarPix(){

  const texto =
    document.getElementById("pix")
    .innerText;

  if(!texto){

    alert("Gere um PIX primeiro");
    return;

  }

  navigator.clipboard.writeText(texto);

  alert("PIX copiado!");

}

</script>

</body>
</html>
